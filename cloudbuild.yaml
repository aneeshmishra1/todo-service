serviceAccount: projects/project-5b3f5b99-01eb-4dc1-818/serviceAccounts/todo-service-build-sa@project-5b3f5b99-01eb-4dc1-818.iam.gserviceaccount.com
steps:

# Step 1: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '-t',
      'asia-south1-docker.pkg.dev/project-5b3f5b99-01eb-4dc1-818/my-firstapi-artifact-registry/todo-service:$SHORT_SHA',
      '.'
    ]

# Step 2: Push image
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'asia-south1-docker.pkg.dev/project-5b3f5b99-01eb-4dc1-818/my-firstapi-artifact-registry/todo-service:$SHORT_SHA'
    ]

# Step 3: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run',
      'deploy', 'todo-service',
      '--image', 'asia-south1-docker.pkg.dev/project-5b3f5b99-01eb-4dc1-818/my-firstapi-artifact-registry/todo-service:$SHORT_SHA',
      '--region', 'asia-south1',
      '--platform', 'managed',
      '--service-account','todo-service-runtime-sa@project-5b3f5b99-01eb-4dc1-818.iam.gserviceaccount.com',
      '--allow-unauthenticated',
      # 🚀 SCALING CONFIG (ADD THESE)
      '--min-instances','1',
      '--max-instances','5',
      '--concurrency','10',

      # ⚡ CPU & MEMORY
      '--cpu','1',
      '--memory','512Mi',

      # ⏱️ Request timeout
      '--timeout','300',
    ]

images:
- 'asia-south1-docker.pkg.dev/project-5b3f5b99-01eb-4dc1-818/my-firstapi-artifact-registry/todo-service:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY


